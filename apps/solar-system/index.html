<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Solar System Explorer</title>
  <meta name="description" content="Real-time 3D solar system in the style of NASA's Eyes on the Solar System: true positions from JPL orbital elements, true scale, time controls, flood or natural lighting." />
  <meta name="theme-color" content="#020308" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='10' fill='%23ffcf6b'/%3E%3Cellipse cx='32' cy='32' rx='28' ry='10' fill='none' stroke='%235ce1e6' stroke-width='3'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="scene" aria-label="3D view of the Solar System"></canvas>
    <div id="labels" class="labels"></div>

    <header class="top">
      <button class="brand" id="home" title="Solar System overview">
        <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="6" fill="#ffcf6b" /><ellipse cx="20" cy="20" rx="17" ry="6.5" fill="none" stroke="#5ce1e6" stroke-width="1.6" /><circle cx="35" cy="22" r="2" fill="#6fa8ff" /></svg>
        <span>Solar System <b>Explorer</b></span>
      </button>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
        <input id="search" placeholder="Search planets & moons…" autocomplete="off" aria-label="Search" />
        <ul id="results" class="results" hidden></ul>
      </div>
      <nav class="quick" id="quick" aria-label="Planets"></nav>
    </header>

    <aside id="info" class="info" hidden>
      <div class="info-head">
        <div>
          <div class="info-type" id="info-type"></div>
          <h1 id="info-name"></h1>
        </div>
        <button class="x" id="info-close" aria-label="Close">×</button>
      </div>
      <dl class="info-kv" id="info-kv"></dl>
      <div class="live" id="info-live"></div>
      <p class="info-fact" id="info-fact"></p>
      <div class="info-actions">
        <button id="info-orbit">Show whole orbit</button>
        <button id="info-zoom">Close-up</button>
      </div>
    </aside>

    <footer class="time">
      <div class="clock">
        <div class="date mono" id="date">—</div>
        <div class="rate" id="rate-label">Real time</div>
      </div>
      <div class="rates" id="rates" role="group" aria-label="Time rate"></div>
      <button class="live-btn" id="live" title="Return to the current time">● LIVE</button>
      <div class="toggles">
        <button data-t="flood" class="active" title="Flood lighting: every world evenly lit (like Eyes’ lighting=flood)">Flood light</button>
        <button data-t="orbits" class="active">Orbits</button>
        <button data-t="labels" class="active">Labels</button>
      </div>
    </footer>
    <div id="loader" class="loader"><div class="ring"></div><div>Computing planetary positions…</div></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
