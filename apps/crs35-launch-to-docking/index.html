<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CRS-35 Launch to Docking</title>
  <meta name="description" content="3D animation of NASA's SpaceX CRS-35 mission: Falcon 9 launch from SLC-40, booster landing, 51 hours of orbit phasing and Dragon docking to the ISS." />
  <meta name="theme-color" content="#04060b" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='28' y='8' width='8' height='44' rx='3' fill='%23f2f2f0'/%3E%3Cpath d='M28 52h8l4 8H24z' fill='%23ffb547'/%3E%3Ccircle cx='32' cy='8' r='4' fill='%235ce1e6'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <!-- "iss/" re-uses the station model, Earth and orbit code from the sibling ISS project -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "iss/": "../iss-eva-spacewalk/src/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="scene" aria-label="3D animation of the CRS-35 mission"></canvas>
    <div id="labels" class="labels"></div>

    <header class="topbar">
      <div class="brand glass">
        <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
          <rect x="17" y="4" width="6" height="26" rx="2" fill="#f2f2f0" />
          <path d="M17 30h6l3 6H14z" fill="#ffb547" />
          <circle cx="20" cy="4" r="3" fill="#5ce1e6" />
        </svg>
        <div>
          <div class="brand-title">CRS-35 <span>Launch → Docking</span></div>
          <div class="brand-sub">NASA · SpaceX Commercial Resupply · Oct 2026</div>
        </div>
      </div>
      <div class="clock glass">
        <div class="clock-item met"><span class="k">MET</span><span class="v mono" id="met">T−00:01:30</span></div>
        <div class="clock-item"><span class="k">UTC</span><span class="v mono" id="utc">—</span></div>
        <div class="clock-item"><span class="k">EDT</span><span class="v mono" id="edt">—</span></div>
        <div class="clock-item act"><span class="k">Act</span><span class="v" id="act">—</span></div>
      </div>
      <div class="top-actions glass">
        <button class="icon-btn" id="btn-left" title="Timeline panel" aria-label="Toggle timeline panel"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h10M4 19h16" /></svg></button>
        <button class="icon-btn" id="btn-right" title="Telemetry panel" aria-label="Toggle telemetry panel"><svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9" /></svg></button>
        <button class="icon-btn" id="btn-full" title="Fullscreen (F)" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg></button>
        <a class="icon-btn" href="../../projects/crs35-launch-to-docking/" title="Documentation" aria-label="Documentation"><svg viewBox="0 0 24 24"><path d="M5 4h9l5 5v11H5zM14 4v5h5M8 13h8M8 17h6" /></svg></a>
      </div>
    </header>

    <aside id="left" class="panel panel-left glass" aria-label="Mission timeline">
      <section>
        <h3>Mission</h3>
        <dl class="facts" id="facts"></dl>
        <div class="sources" id="sources"></div>
      </section>
      <section class="grow">
        <h3>Timeline</h3>
        <ol id="chapters" class="chapters"></ol>
      </section>
    </aside>

    <aside id="right" class="panel panel-right glass" aria-label="Telemetry">
      <section>
        <h3 id="tele-title">Telemetry</h3>
        <div class="readouts" id="readouts"></div>
      </section>
      <section>
        <h3>Now</h3>
        <div class="now-title" id="now-title">—</div>
        <p class="now-detail" id="now-detail"></p>
      </section>
      <section id="stages-section">
        <h3>Vehicles</h3>
        <div class="stages" id="stages"></div>
      </section>
    </aside>

    <nav class="views glass" id="views" aria-label="Camera"></nav>

    <footer class="transport glass">
      <button class="play" id="play" aria-label="Play / pause (space)">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" /></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z" /></svg>
      </button>
      <div class="scrub">
        <div class="acts" id="acts"></div>
        <div class="track">
          <div class="fill" id="fill"></div>
          <div class="ticks" id="ticks"></div>
          <input type="range" id="scrub" min="0" max="10000" step="1" value="0" aria-label="Mission time" />
        </div>
      </div>
      <div class="speeds" id="speeds" role="group" aria-label="Time warp">
        <button data-speed="auto" class="active" title="Auto warp per phase">Auto</button>
        <button data-speed="1">1×</button>
        <button data-speed="10">10×</button>
        <button data-speed="100">100×</button>
        <button data-speed="3000">3k×</button>
      </div>
    </footer>

    <div id="toast" class="toast glass" aria-live="polite"></div>
    <div id="loader" class="loader"><div class="loader-ring"></div><div class="loader-text">Fuelling Falcon 9…</div></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
