<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Gadkille: Forts of Swarajya</title>
  <meta name="description" content="3D explorer of the forts of Chhatrapati Shivaji Maharaj in Maharashtra, on real terrain: Raigad, Rajgad, Shivneri, Sinhagad, Pratapgad, Sindhudurg and more, with a timeline of his life." />
  <meta name="theme-color" content="#1a120c" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M14 6v54' stroke='%23e8dcc8' stroke-width='4'/%3E%3Cpath d='M16 8h40L42 20l14 12H16z' fill='%23ff7a00'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Marathi&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>
    <div id="labels" class="labels"></div>

    <header class="top">
      <button class="brand" id="home" title="Map of all forts">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9 4v33" stroke="#e8dcc8" stroke-width="2.4"/><path d="M10.5 5.5h24l-8 7.5 8 7.5h-24z" fill="#ff7a00"/></svg>
        <span class="mr">गडकिल्ले</span><span class="en">Forts of Swarajya</span>
      </button>
      <select id="fort" aria-label="Choose a fort"></select>
      <div class="seg" id="season" role="group" aria-label="Season"></div>
      <label class="hour"><span id="hour-l" class="mono">09:00</span><input id="hour" type="range" min="5.5" max="19" step="0.25" value="9" aria-label="Time of day (IST)" /></label>
      <div class="seg">
        <button id="t-tour" title="Slowly circle the fort">Tour</button>
        <button id="t-labels" class="active">Labels</button>
      </div>
    </header>

    <aside class="list" id="list"></aside>
    <aside class="panel" id="panel"></aside>

    <footer class="timeline" id="timeline">
      <button id="tl-play" class="play" aria-label="Play timeline"><svg viewBox="0 0 24 24"><path id="tl-ico" d="M8 5v14l11-7z"/></svg></button>
      <div class="tl-main">
        <div class="tl-row"><b id="tl-year" class="mono">1630</b><span id="tl-text"></span></div>
        <input type="range" id="tl" min="0" max="10" value="0" step="1" aria-label="Timeline" />
        <div class="tl-ticks" id="tl-ticks"></div>
      </div>
    </footer>
    <div class="credit">Terrain: Terrarium elevation tiles (AWS Open Data · Mapzen/Tilezen · SRTM) · walls traced from real terrain, buildings indicative · historical notes summarised from public sources</div>
    <div id="loader" class="loader"><div class="ring"></div><div class="mr">स्वराज्य</div><div id="loader-t">Loading the Sahyadri…</div></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
