<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Earthmovers</title>
  <meta name="description" content="A 3D portfolio of heavy construction machinery: backhoe loader, excavator, wheel loader, dozer, haul truck, motor grader, telehandler and skid steer. Operate each machine, configure and price it, compare them, plan a loading fleet, dig in a sandbox and watch a job site at work." />
  <meta name="theme-color" content="#14171b" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='40' width='34' height='12' rx='6' fill='%23222'/%3E%3Crect x='8' y='26' width='26' height='14' rx='2' fill='%23f2b705'/%3E%3Crect x='12' y='14' width='12' height='12' rx='2' fill='%23f2b705'/%3E%3Cpath d='M34 30 L50 14 L58 22 L56 36 L48 36 L52 24 L38 36z' fill='%23f2b705'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="app">
    <aside class="left">
      <div class="brand"><b>Earthmovers</b><span>Heavy equipment portfolio · 8 machine classes</span></div>
      <div id="cards" class="cards"></div>
      <p class="fine">Generic machines modelled on typical machines of each class. Not affiliated with any manufacturer; figures are illustrative.</p>
    </aside>
    <main class="view">
      <canvas id="scene"></canvas>
      <div id="labels"></div>
      <header class="bar">
        <div class="seg" id="modes"><button data-mode="show" class="active">🏛 Showroom</button><button data-mode="sand">⛏ Sandbox</button><button data-mode="site">🏗 Job site</button></div>
        <div class="seg" id="cams"><button data-cam="iso">3/4</button><button data-cam="side">Side</button><button data-cam="front">Front</button><button data-cam="top">Top</button><button data-cam="cab">Cab</button></div>
        <div class="seg" id="toggles"><button data-t="hot" class="active" title="Hotspots">◉ Hotspots</button><button data-t="dims" title="Overall dimensions">↔ Dimensions</button><button data-t="spin" title="Turntable">⟲ Turntable</button><button data-t="snd" title="Engine sound">🔊</button></div>
      </header>
      <div id="title" class="vtitle"></div>
      <div id="hud" class="hud"></div>
      <div id="tipcard" class="tipcard"></div>
      <div id="sitebar" class="sitebar"></div>
      <div class="hint" id="hint">Drag to orbit · wheel to zoom · right-drag to pan</div>
    </main>
    <aside class="right">
      <nav class="tabs"><button data-tab="over" class="active">Overview</button><button data-tab="op">Operate</button><button data-tab="cfg">Configure</button><button data-tab="cmp">Compare</button><button data-tab="fleet">Fleet</button></nav>
      <section class="tab show" id="tab-over"></section>
      <section class="tab" id="tab-op"></section>
      <section class="tab" id="tab-cfg"></section>
      <section class="tab" id="tab-cmp"></section>
      <section class="tab" id="tab-fleet"></section>
    </aside>
    <div class="toast" id="toast"></div>
    <div id="loader" class="loader"><div class="ring"></div><div>Starting engines…</div></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
