<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#cfd6dd}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script></head>
<body><script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildTractor } from './src/tractor.js';
import { BUILD } from './src/implements.js';
import { TRACTORS } from './src/data.js';
const q = new URLSearchParams(location.hash.slice(1));
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.shadowMap.enabled = true; r.toneMapping = THREE.NeutralToneMapping; document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color('#cfd6dd'); s.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture; s.environmentIntensity = 0.6;
const sun = new THREE.DirectionalLight('#fff', 1.6); sun.position.set(8, 14, 10); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12 }); s.add(sun, new THREE.HemisphereLight('#fff', '#888', 0.5));
const gnd = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: '#b9a37a' })); gnd.rotation.x = -Math.PI / 2; gnd.receiveShadow = true; s.add(gnd);
const T = buildTractor(TRACTORS[q.get('hp') || 50], '#c4241b'); s.add(T.root);
const id = q.get('imp');
if (id) { const imp = BUILD[id](T.hitchH0); if (imp.hitch === 'drawbar') { imp.root.position.copy(T.drawbar); s.add(imp.root); } else if (imp.hitch === 'stationary') { imp.root.position.set(-1.0, 0, 0); T.root.add(imp.root); imp.ptoIn.add(imp.root.position); } T.attach(imp); T.setHitch(+(q.get('h') || 0)); for (let i = 0; i < 20; i++) imp.update(0.03, 0.1, { working: true, pto: true }); T.update(0.03, 0.1, 0, true); }
const box = new THREE.Box3().setFromObject(s.children.find(o=>o===T.root) && T.root.parent===s ? s : T.root); const b2 = new THREE.Box3(); s.traverse(o=>{ if(o.isMesh && o!==gnd) b2.expandByObject(o); });
const c = b2.getCenter(new THREE.Vector3()), sz = b2.getSize(new THREE.Vector3()).length();
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 500);
const v = q.get('v') || 'iso', d = sz * 1.0;
if (v === 'side') cam.position.set(c.x, c.y + 0.3, c.z + d * 1.3); else if (v === 'rear') cam.position.set(c.x - d, c.y + d * 0.45, c.z - d * 0.55); else cam.position.set(c.x + d * 0.75, c.y + d * 0.45, c.z + d * 0.9);
cam.lookAt(c); r.render(s, cam); window.done = true;
</script></body></html>
